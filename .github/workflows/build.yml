name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails fast (seconds, not minutes) on the two things that have broken
  # releases before: a stale Cargo.lock, which makes every `--locked` build
  # (Arch, Debian) fail, and a tag that does not match Cargo.toml.
  check:
    name: Check lockfile & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock is up to date
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock is out of date — run 'cargo update --workspace' (or 'cargo build') and commit Cargo.lock."
            exit 1
          fi

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          tag_ver=${GITHUB_REF_NAME#v}
          echo "Cargo.toml: $cargo_ver | tag: $tag_ver"
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "::error::Tag v$tag_ver does not match Cargo.toml version $cargo_ver — bump Cargo.toml and re-tag."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nightwave-plaza
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nightwave-plaza.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwave-plaza-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  package-deb:
    name: Package (Debian .deb)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --output target/debian/nightwave-plaza.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwave-plaza-deb
          path: target/debian/nightwave-plaza.deb
          if-no-files-found: error

  package-arch:
    name: Package (Arch .pkg.tar.zst)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Arch package
        run: |
          docker run --rm -v "$PWD":/build archlinux:latest bash -c '
            set -euo pipefail
            # makepkg refuses to run as root, and files it creates must end up
            # owned by the runner user again (also on failure, or the checkout
            # cleanup step cannot touch .git). Do that in a trap.
            host_uid=$(stat -c %u /build)
            host_gid=$(stat -c %g /build)
            trap "chown -R $host_uid:$host_gid /build" EXIT
            # The base image keyring can be older than the packages we pull;
            # refreshing it first avoids spurious signature failures.
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Su --noconfirm --needed base-devel rust alsa-lib dbus pkgconf
            useradd -m builder
            chown -R builder:builder /build
            sudo -u builder bash -c "cd /build/dist && makepkg -f --noconfirm"
          '

      - name: Collect package
        run: |
          mkdir -p out
          cp dist/*.pkg.tar.zst out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwave-plaza-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, package-deb, package-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files
        run: |
          mkdir release
          cp artifacts/nightwave-plaza-windows/nightwave-plaza.exe release/nightwave-plaza.exe
          cp artifacts/nightwave-plaza-linux/nightwave-plaza      release/nightwave-plaza-linux
          cp artifacts/nightwave-plaza-deb/*.deb                  release/
          cp artifacts/nightwave-plaza-arch/*.pkg.tar.zst         release/
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
